<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Pokerdom{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
</head>
<body class="poker-body d-flex flex-column min-vh-100">

<nav class="navbar navbar-expand-lg poker-navbar sticky-top">
  <div class="container-fluid px-4">
    <a class="navbar-brand fw-bold" href="{{ url_for('index') }}">
      <span class="text-danger">♥</span><span class="text-white">♠</span>
      <span class="ms-1 text-white">Pokerdom</span>
    </a>
    <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item">
          <a class="nav-link {% if request.endpoint=='index' %}active{% endif %}"
             href="{{ url_for('index') }}"><i class="bi bi-house me-1"></i>Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.endpoint=='analyzer' %}active{% endif %}"
             href="{{ url_for('analyzer') }}"><i class="bi bi-calculator me-1"></i>Analyzer</a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.endpoint=='history' %}active{% endif %}"
             href="{{ url_for('history') }}"><i class="bi bi-clock-history me-1"></i>History</a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<main class="container-fluid px-4 py-4 flex-grow-1">
  {% block content %}{% endblock %}
</main>

<footer class="text-center py-2 border-top border-secondary">
  <small class="text-muted">♠ Pokerdom — Texas Hold'em Analyzer ♠</small>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc4s9bIOgUxi8T/jzmFe1BYXcoFGnm3ZkKvhHHiMwdoe" crossorigin="anonymous"></script>
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
